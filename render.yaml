services:
  - type: web
    name: mealseal-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./MealSeal.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: Firebase__ProjectId
        value: mealseal-c49a9
      - key: Firebase__ServiceAccountJson
        sync: false
      - key: MealSeal__PrivateKeyPem
        sync: false
      - key: MealSeal__PublicKeyPem
        sync: false
      - key: Seed__AdminUid
        sync: false
      - key: Seed__StaffUid
        sync: false
      - key: Seed__StaffRestaurantId
        sync: false
