services:
  - type: web
    name: mealseal-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./MealSeal.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: MealSeal__PrivateKeyPem
        sync: false
      - key: MealSeal__PublicKeyPem
        sync: false
      - key: Auth__PrivateKeyPem
        sync: false
      - key: Auth__PublicKeyPem
        sync: false
      - key: Seed__AdminEmail
        sync: false
      - key: Seed__AdminPassword
        sync: false
      - key: Seed__StaffEmail
        sync: false
      - key: Seed__StaffPassword
        sync: false
      - key: Seed__StaffRestaurantId
        sync: false
